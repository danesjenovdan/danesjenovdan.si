apiVersion: apps/v1
kind: Deployment
metadata:
  name: danesjenovdan-staging
  labels:
    app: danesjenovdan-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: danesjenovdan-staging
  template:
    metadata:
      labels:
        app: danesjenovdan-staging
    spec:
      securityContext:
        fsGroup: 1000
      volumes:
        - name: danesjenovdan-staging-storage
          emptyDir: {}
      initContainers:
        - name: collectstatic
          image: danesjenovdan-staging
          volumeMounts:
            - name: danesjenovdan-staging-storage
              mountPath: /storage
          command:
            - python
            - manage.py
            - collectstatic
            - --no-input
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: djnd.settings.production
          envFrom:
            - secretRef:
                name: danesjenovdan-staging-secrets
          resources:
            requests:
              memory: 500Mi
              cpu: 500m
            limits:
              memory: 1Gi
              cpu: 1000m
        - name: migrate
          image: danesjenovdan-staging
          volumeMounts:
            - name: danesjenovdan-staging-storage
              mountPath: /storage
          command:
            - python
            - manage.py
            - migrate
            - --no-input
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: djnd.settings.production
          envFrom:
            - secretRef:
                name: danesjenovdan-staging-secrets
          resources:
            requests:
              memory: 500Mi
              cpu: 500m
            limits:
              memory: 1Gi
              cpu: 1000m
      containers:
        - name: djnd
          image: danesjenovdan-staging
          volumeMounts:
            - name: danesjenovdan-staging-storage
              mountPath: /storage
          command:
            - gunicorn
            - djnd.wsgi:application
            - -b
            - 0.0.0.0:8000
            - --log-level
            - DEBUG
            - --workers
            - "1"
            - --threads
            - "4"
            - --timeout
            - "90"
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: djnd.settings.production
          envFrom:
            - secretRef:
                name: danesjenovdan-staging-secrets
          resources:
            requests:
              memory: 500Mi
              cpu: 500m
            limits:
              memory: 1Gi
              cpu: 1500m
        - name: djnd-nginx
          image: nginx:alpine
          volumeMounts:
            - name: danesjenovdan-staging-storage
              mountPath: /usr/share/nginx/html
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 100Mi
              cpu: 100m
            limits:
              memory: 200Mi
              cpu: 200m
