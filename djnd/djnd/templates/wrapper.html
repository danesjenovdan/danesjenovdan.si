{% extends "base.html" %}
{% load static %}

{% block wrapper_content %}
<div class="text-dark max-md:pt-[69px]">
  <header class="hidden max-md:block fixed top-0 left-0 right-0 z-40 bg-white border-b">
    {% include "includes/header.html" %}
  </header>
  <aside id="sidebar" class="fixed top-0 left-0 z-50 w-[255px] h-full overflow-y-auto bg-white border-r transition-transform duration-500 ease-out max-md:-translate-x-full">
    {% include "includes/sidebar.html" %}
  </aside>
  <div class="ml-[255px] max-md:ml-0 flex flex-col min-h-screen">
    <main class="flex-1">
      {% block content %}{% endblock content %}
    </main>
    <footer class="shrink-0 grow-0 border-t">
      {% include "includes/footer.html" %}
    </footer>
  </div>
</div>
{% endblock wrapper_content %}
