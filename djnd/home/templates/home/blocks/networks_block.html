{% load wagtailcore_tags wagtailimages_tags %}

<div class="bg-very-light">
    <div class="flex gap-10 max-w-[1280px] mx-auto px-14 pt-16 max-sm:block max-sm:px-6 max-sm:pt-8">
        <div class="basis-8/12">
            <h2 class="mb-6 text-2xl font-semibold max-xl:text-lg">{{ value.title }}</h2>
            <div class="rich-text mb-12 max-sm:mb-6">
                {{ value.description|richtext }}
            </div>
        </div>
        <div class="basis-4/12 max-sm:hidden">&nbsp;</div>
    </div>
    <div class="max-w-[1280px] mx-auto px-14 pb-16 max-sm:px-6 max-sm:pb-8">
        {% include 'home/partials/partner_links.html' with partners=value.networks %}
    </div>
</div>
