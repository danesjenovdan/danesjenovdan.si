{% load static wagtailcore_tags %}

<div class="bg-white">
  <div class="flex gap-10 max-w-[1280px] mx-auto px-14 pt-16 max-sm:block max-sm:px-6 max-sm:pt-8">
    <div class="basis-8/12">
      <h2 class="text-2xl font-semibold mb-6 max-xl:text-lg">{{ value.title }}</h2>
      <div class="rich-text">
        <p>
          {{ value.description }}
        </p>
      </div>
    </div>
    <div class="basis-4/12 max-sm:hidden">&nbsp;</div>
  </div>
  <div class="max-w-[1280px] mx-auto px-14 pb-16 max-sm:px-6 max-sm:pb-8">
    {% include "home/partials/pillar_grid.html" with open_new_tab=False grid_items=value.pillars %}
  </div>
</div>
