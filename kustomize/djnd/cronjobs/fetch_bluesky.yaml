apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-bluesky
spec:
  schedule: "45 * * * *" # At HH:45 every hour.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
          volumes:
            - name: danesjenovdan-storage
              emptyDir: {}
          initContainers:
            - name: collectstatic
              image: danesjenovdan
              volumeMounts:
                - name: danesjenovdan-storage
                  mountPath: /storage
              command:
                - python
                - manage.py
                - collectstatic
                - --no-input
              env:
                - name: DJANGO_SETTINGS_MODULE
                  value: djnd.settings.production
              envFrom:
                - secretRef:
                    name: danesjenovdan-secrets
          containers:
            - name: fetch-bluesky
              image: danesjenovdan
              volumeMounts:
                - name: danesjenovdan-storage
                  mountPath: /storage
              command:
                - python
                - manage.py
                - fetch_bluesky
              env:
                - name: DJANGO_SETTINGS_MODULE
                  value: djnd.settings.production
              envFrom:
                - secretRef:
                    name: danesjenovdan-secrets
